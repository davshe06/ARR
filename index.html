<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&family=Barlow+Condensed:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <meta name="build" content="__BUILD__" />
    <meta name="build-at" content="__BUILT_AT__" />
    <title>The Recruiting Bullpen</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Vite's dev entry. Vite replaces this tag at build time, so it only
         ever runs when this file is served raw — which is exactly what
         happens if GitHub Pages is set to publish the branch instead of the
         Actions artifact. A .tsx file served as plain text is refused as a
         module, nothing mounts, and the page dies silently; onerror catches
         that and hands over to the built copy committed alongside it. -->
    <script
      type="module"
      src="/src/main.tsx"
      onerror="location.replace('./app.html' + location.search + location.hash)"
    ></script>
    <script>
      /* The document is the whole app now, so a stale copy sitting in a
         browser or CDN cache renders an old page with no other symptom and
         survives a refresh. Ask the server which build is current, and reload
         once if this copy is behind. Failure here is silent by design — the
         page already works without it. */
      (function () {
        try {
          var meta = document.querySelector('meta[name="build"]');
          var mine = meta && meta.content;
          if (!mine || mine.charAt(0) === '_') return;
          fetch('./version.json?t=' + Date.now(), { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (v) {
              if (!v || !v.build || v.build === mine) return;
              try {
                if (sessionStorage.getItem('bullpen-build') === v.build) return;
                sessionStorage.setItem('bullpen-build', v.build);
              } catch (e) { /* private mode: reload once anyway */ }
              location.reload();
            })
            .catch(function () {});
        } catch (e) { /* no fetch, no problem */ }
      })();
    </script>
    <script>
      /* If the bundle never loads, React mounts nothing and the page is a
         blank white sheet with no explanation. Say what happened instead.
         A late mount overwrites this, so a slow connection costs nothing. */
      setTimeout(function () {
        var root = document.getElementById('root');
        if (!root || root.childElementCount) return;
        root.innerHTML =
          '<div style="font:15px/1.6 system-ui,sans-serif;color:#1d1f20;max-width:34em;margin:80px auto;padding:0 24px">' +
          '<strong>The Recruiting Bullpen didn\u2019t load.</strong><br>' +
          'The page asset failed to fetch \u2014 usually a cached copy of this page pointing at an old build. ' +
          'Hard-refresh (Ctrl/Cmd + Shift + R) to pick up the current one.</div>';
      }, 4000);
    </script>
  </body>
</html>
